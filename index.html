<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fala Comigo"><meta name="theme-color" content="#1D4FA3"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fala Comigo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: one centred column of glazed-tile panels; a cobalt azulejo band heads every screen. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#13213D; --muted:#56678A; --line:#D4DDEB;
  --cobalt:#1D4FA3; --cobalt-soft:#E2EAF8; --on-cobalt:#FFFFFF; --band-ink:#FFFFFF;
  --sun:#F2B33D; --sun-soft:#FDF0D3; --sun-ink:#6B4A00; --on-sun:#2B1D00;
  --good:#1E7B4F; --good-soft:#DDF2E6; --bad:#B3261E; --bad-soft:#FBE2DF;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#152038; --ink:#E7EDF8; --muted:#9BA9C4; --line:#283657;
  --cobalt:#82A8F2; --cobalt-soft:#1B2B4D; --on-cobalt:#0D1524; --band-ink:#0D1524;
  --sun:#F2B33D; --sun-soft:#3A2D10; --sun-ink:#F6D58C; --on-sun:#2B1D00;
  --good:#62D49C; --good-soft:#12342A; --bad:#FF8C82; --bad-soft:#3C1B1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#152038; --ink:#E7EDF8; --muted:#9BA9C4; --line:#283657;
  --cobalt:#82A8F2; --cobalt-soft:#1B2B4D; --on-cobalt:#0D1524; --band-ink:#0D1524;
  --sun:#F2B33D; --sun-soft:#3A2D10; --sun-ink:#F6D58C; --on-sun:#2B1D00;
  --good:#62D49C; --good-soft:#12342A; --bad:#FF8C82; --bad-soft:#3C1B1B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:780px;margin:0 auto;padding-block:16px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,42px)} h2{font-size:26px} h3{font-size:20px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* azulejo band */
.band{position:relative;overflow:hidden;border-radius:20px;background:var(--cobalt);color:var(--on-cobalt);padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px}
.band::before{content:"";position:absolute;inset:0;background:var(--band-ink);opacity:.16;
  -webkit-mask:var(--azulejo) 0 0/52px 52px repeat;mask:var(--azulejo) 0 0/52px 52px repeat}
.band>*{position:relative}
.band p{max-width:58ch}
.bandTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--sun);color:var(--on-sun);font-variant-numeric:tabular-nums}
.linkBtn{background:none;border:0;padding:6px 0;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;min-height:48px;text-align:center}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{font-size:18px;padding:14px 24px}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.play{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--cobalt)}
.play:hover{border-color:var(--cobalt)}
.play svg{width:22px;height:22px}
.play.sm{width:36px;height:36px}.play.sm svg{width:16px;height:16px}
.play.huge{width:96px;height:96px}.play.huge svg{width:44px;height:44px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.callout{background:var(--sun-soft);color:var(--ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.callout b{color:var(--sun-ink)}
.notice{background:var(--cobalt-soft);border-radius:var(--r);padding:12px 16px;font-size:15px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:none;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--cobalt);color:var(--on-cobalt)}

/* profile picker */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.person{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.person:hover{border-color:var(--cobalt)}
.avatar{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;background:var(--cobalt);color:var(--on-cobalt);position:relative;overflow:hidden}
.avatar::before{content:"";position:absolute;inset:0;background:var(--band-ink);opacity:.18;-webkit-mask:var(--azulejo) 0 0/28px 28px repeat;mask:var(--azulejo) 0 0/28px 28px repeat}
.avatar span{position:relative}
.avatar.junior{background:var(--sun);color:var(--on-sun)}
.avatar.little{background:var(--good);color:var(--on-cobalt)}
.person .name{font-family:var(--display);font-size:24px}
.edit{display:flex;flex-direction:column;gap:12px}
.edit .row>*{flex:1 1 160px}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--cobalt);outline:none}

/* units */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.unit{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-width:0}
.unit:hover{border-color:var(--cobalt)}
.unit.next{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.unit .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.unit .n{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--sun);letter-spacing:2px;font-size:18px}
.stars .off{color:var(--line)}
.tag{font-size:12px;font-weight:700;background:var(--sun);color:var(--on-sun);border-radius:999px;padding:2px 10px}

/* learn card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pt{font-family:var(--display);font-size:clamp(28px,6vw,40px);line-height:1.15;overflow-wrap:anywhere}
.en{font-size:19px}
.say{font-size:16px;color:var(--cobalt);font-weight:700;letter-spacing:.02em}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cobalt);border-radius:99px;transition:width .3s}

/* quiz */
.q{display:flex;flex-direction:column;gap:16px}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;min-height:56px}
.choice:hover:not(:disabled){border-color:var(--cobalt)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default;color:var(--ink)}
.answerLine{min-height:62px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{padding:10px 14px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer;font-size:18px}
.word:hover{border-color:var(--cobalt)}
.word.used{visibility:hidden}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb .head{font-weight:700;font-size:18px}
.fb.good .head{color:var(--good)} .fb.bad .head{color:var(--bad)}

/* review */
.boxes{display:flex;gap:6px;align-items:flex-end;height:80px}
.boxes div{flex:1;background:var(--cobalt);border-radius:6px 6px 0 0;min-height:4px;opacity:.85}
.boxLabels{display:flex;gap:6px}.boxLabels span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}

/* chat */
.scenarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.scen{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.scen:hover{border-color:var(--cobalt)}
.scen[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lvl{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700}
.lvl[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt);color:var(--on-cobalt)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:6px}
.msg .bub{padding:12px 14px;border-radius:16px;font-size:18px;overflow-wrap:anywhere}
.msg.them{align-self:flex-start}
.msg.them .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--cobalt);color:var(--on-cobalt);border-bottom-right-radius:4px}
.msg .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .tr{font-size:15px;color:var(--muted);font-style:italic}
.fix{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:15px;max-width:100%}
.fix b{color:var(--sun-ink)}
.hint{border:2px dashed var(--cobalt);background:none;color:var(--cobalt);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:15px;font-weight:700;text-align:left}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{resize:none;min-height:52px;flex:1;min-width:0}
.typing{color:var(--muted);font-style:italic}

/* sounds */
.sound{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.sound:first-of-type{border-top:0;padding-top:0}
.exs{display:flex;gap:8px;flex-wrap:wrap}
.ex{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer}
.ex:hover{border-color:var(--cobalt)}
.ex .dot{width:30px;height:30px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);display:inline-flex;align-items:center;justify-content:center}
.ex .dot svg{width:14px;height:14px}
.ex b{font-family:var(--display);font-weight:400;font-size:18px}
.ex i{font-style:normal;color:var(--muted);font-size:14px}
.tblWrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.pt-col{font-weight:700;color:var(--cobalt)}
td.br-col{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{min-height:84px;border-radius:12px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;padding:8px;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.mcard.pt{font-family:var(--display);font-weight:400;font-size:18px;color:var(--cobalt)}
.mcard.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.mcard.done{visibility:hidden}
.mcard.bad{border-color:var(--bad);background:var(--bad-soft)}
.timer{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}

/* little */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.topic{border:3px solid var(--line);border-radius:22px;background:var(--surface);cursor:pointer;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.topic:hover{border-color:var(--cobalt)}
.topic .emo{font-size:60px;line-height:1}
.topic .t{font-family:var(--display);font-size:22px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ltile{border:3px solid var(--line);border-radius:22px;background:var(--surface);cursor:pointer;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center}
.ltile:hover{border-color:var(--cobalt)}
.ltile .w{font-family:var(--display);font-size:20px;text-align:center}
.emo{font-size:64px;line-height:1}
.emo.num{font-family:var(--display);color:var(--cobalt);font-size:72px}
.swatch{width:72px;height:72px;border-radius:50%;border:3px solid var(--line);display:block}
.ltile.right{border-color:var(--good);background:var(--good-soft)}
.ltile.wrong{animation:shake .4s}
.ltile.pop{animation:pop .35s}
.game3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.game3 .ltile{min-height:170px}
.bigStars{font-size:44px;color:var(--sun);letter-spacing:4px;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.card{padding:20px 16px}.panel{padding:16px}.game3 .ltile{min-height:130px}.emo{font-size:52px}}
</style>

 {id:'familia', title:'A família', en:'The family', tip:'Possessives take "the": <b>a minha mãe</b> is literally "the my mother". Listen for <b>avô</b> (grandad, closed "oh") and <b>avó</b> (grandma, open "aw"). The accent changes the person!', items:[

 {id:'mesa', title:'À mesa', en:'At the family table', tip:'Lunch is serious business. You will be offered more food. Then more again. <b>Já estou cheio</b> with a hand on your stomach and a big smile is your best defence.', items:[

 {id:'carinho', title:'Com carinho', en:'Warmth and kind words', tip:'<b>Saudade</b> is the famous Portuguese word for missing someone deeply. <b>Tenho saudades vossas</b> (I miss you all) will go down very well on the phone to her family.', items:[

 {id:'irregular', title:'Verbos rebeldes', en:'The irregular past', tip:'The most common verbs are irregular in the past, so learn them as words: <b>fui</b> (I went / I was), <b>tive</b> (I had), <b>fiz</b> (I did), <b>estive</b> (I was), <b>disse</b> (I said), <b>vim</b> (I came). Ser and ir share the same past, so <b>fui</b> means both "I was" and "I went".', items:[

let VOICE=null, VOICE_KIND='none', PT_VOICES=[], RATE=0.9, VPREF={};
try { VPREF = JSON.parse(localStorage.getItem('falaComigo.voice')) || {}; } catch(e) {}
if (+VPREF.rate) RATE = +VPREF.rate;
const vLang = v => (v.lang||'').replace('_','-').toLowerCase();
const isRobot = v => /^microsoft/i.test(v.name) && !/natural|online/i.test(v.name);
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  PT_VOICES = speechSynthesis.getVoices().filter(v=>vLang(v).startsWith('pt'))
    .sort((a,b)=>(vLang(b)==='pt-pt')-(vLang(a)==='pt-pt') || isRobot(a)-isRobot(b));
  VOICE = PT_VOICES.find(v=>v.name===VPREF.name)
    || PT_VOICES.find(v=>vLang(v)==='pt-pt' && /natural|online|premium|enhanced/i.test(v.name))
    || PT_VOICES.find(v=>vLang(v)==='pt-pt' && !isRobot(v)) || PT_VOICES[0] || null;
  const was = VOICE_KIND;
  VOICE_KIND = !VOICE ? 'none' : vLang(VOICE)!=='pt-pt' ? 'br' : isRobot(VOICE) ? 'robot' : 'pt';
  if (was!==VOICE_KIND && ['home','ltopic'].includes(V.screen)) render();
}
function saveVoicePref(){ try { localStorage.setItem('falaComigo.voice', JSON.stringify(VPREF)); } catch(e) {} }
function utter(text, slow, voice, pitch){
  const u = new SpeechSynthesisUtterance(String(text).replace(/\.\.\.|…/g,'').replace(/\s\/\s/g,', '));
  const v = voice || VOICE;
  u.lang = v ? v.lang : 'pt-PT'; if (v) u.voice=v; u.rate = slow ? Math.max(0.4, RATE*0.65) : RATE;
  if (pitch) u.pitch = pitch;
  return u;
}
function speak(text, slow){
  if (!('speechSynthesis' in window) || !text) return;
  try { speechSynthesis.cancel(); speechSynthesis.speak(utter(text, slow)); } catch(e) {}
}
// a dialogue: second speaker gets a different voice where the device has one, else a lower pitch
function speakLines(lines, slow){
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const alt = VOICE && PT_VOICES.find(v=>v!==VOICE && vLang(v)===vLang(VOICE) && !isRobot(v));
    lines.forEach(l=>{ const b=l.who==='B'; speechSynthesis.speak(utter(l.pt, slow, b&&alt?alt:VOICE, b&&!alt?0.8:1)); });
  } catch(e) {}
}

/* ---------- quiz engine ---------- */
function choices(id, field, P){
  const p=PH[id]; const tr = p.unit ? p.unit.track : (P.track==='little'?'junior':P.track);
  const cand=[...shuffle(p.unit?p.unit.ids:[]), ...shuffle(TRACK_IDS[tr])];
  const out=[p[field]];
  for (const c of cand) { const v=PH[c][field]; if (!out.some(o=>o.toLowerCase()===v.toLowerCase())) out.push(v); if (out.length===4) break; }
  return shuffle(out);
}
const tokens = s => s.split(/\s+/).filter(Boolean);
function makeQ(id, type, P){
  const p=PH[id]; const q={id, t:type, done:false};
  const words=tokens(p.pt);
  if (q.t==='build' && (words.length<3 || words.length>8 || p.pt.includes('...'))) q.t = 'en2pt';
  if (q.t==='pt2en') q.opts = choices(id,'en',P);
  else if (q.t==='build') {
    const extra=[]; for (const c of shuffle(TRACK_IDS[p.unit?p.unit.track:'adult'])) { for (const w of tokens(PH[c].pt)) { if (!words.includes(w) && !extra.includes(w)) { extra.push(w); break; } } if (extra.length===2) break; }
    q.bank = shuffle([...words, ...extra]); q.built=[];
  } else q.opts = choices(id,'pt',P);
  return q;
}
function startQuiz(P, ids, mode, unitId){
  const types = shuffle(['pt2en','en2pt','listen','build']);
  const queue = shuffle(ids).map((id,i)=>makeQ(id, types[i%4], P));
  V.quiz = {mode, unitId, queue, idx:0, missed:new Set(), requeued:new Set(), ids:[...ids], answered:null, xp:0};
  go({screen:'quiz'});
  autoSpeakQ();
}
function autoSpeakQ(){ const q=V.quiz.queue[V.quiz.idx]; if (q && (q.t==='pt2en'||q.t==='listen')) speak(PH[q.id].pt); }
function quizView(P){
  const Q=V.quiz, q=Q.queue[Q.idx], p=PH[q.id];
  const pct = Q.idx/Q.queue.length*100;
  let prompt='', body='';
  const a = Q.answered;
  if (q.t==='pt2en'){ prompt=`<span class="label">What does this mean?</span><div class="row">${playBtn(p.pt)}<div class="pt">${esc(p.pt)}</div></div>`; }
  if (q.t==='en2pt'){ prompt=`<span class="label">How do you say this in Portuguese?</span><div class="pt">${esc(p.en)}</div>`; }
  if (q.t==='listen'){ prompt=`<span class="label">Listen. Which one did you hear?</span><div class="row">${playBtn(p.pt,'huge')}${playBtn(p.pt,'',true)}</div>`; }
  if (q.t==='build'){ prompt=`<span class="label">Build it in Portuguese</span><div class="pt">${esc(p.en)}</div>`; }
  if (q.opts){
    const right = q.t==='pt2en' ? p.en : p.pt;
    body = `<div class="choices">${q.opts.map((o,i)=>{
      let cls=''; if (a){ if (o===right) cls='right'; else if (a.pick===i) cls='wrong'; }
      return `<button class="choice ${cls}" data-act="pick" data-i="${i}" ${a?'disabled':''}>${esc(o)}</button>`; }).join('')}</div>`;
  } else {
    body = `<div class="answerLine" aria-label="Your sentence">${q.built.map((bi,k)=>`<button class="word" data-act="untile" data-k="${k}" ${a?'disabled':''}>${esc(q.bank[bi])}</button>`).join('') || '<span class="muted small" style="align-self:center">Tap the words below in the right order</span>'}</div>
      <div class="bank">${q.bank.map((w,bi)=>`<button class="word${q.built.includes(bi)?' used':''}" data-act="tile" data-bi="${bi}" ${a||q.built.includes(bi)?'disabled':''}>${esc(w)}</button>`).join('')}</div>
      ${a?'':`<div class="row end"><button class="btn primary" data-act="check" ${q.built.length?'':'disabled'}>Check</button></div>`}`;
  }
  const fb = a ? `<div class="fb ${a.ok?'good':'bad'}" role="status">
      <span class="head">${a.ok ? shuffle(['Muito bem!','Boa!','Isso mesmo!','Excelente!'])[0] : 'Not quite. Here\'s the answer:'}</span>
      <div class="row">${playBtn(p.pt,'sm')}<b style="font-size:19px">${esc(p.pt)}</b></div>
      <span>${esc(p.en)}${p.say?` <span class="say">· ${esc(p.say)}</span>`:''}</span>
      ${!a.ok?'<span class="small muted">This one will come back again before the end.</span>':''}
      <div class="row end"><button class="btn ${a.ok?'primary':''} big" data-act="cont" id="contBtn">Continue</button></div>
    </div>` : '';
  return `<div class="row between"><button class="linkBtn" data-act="quitQuiz">← Stop</button><span class="small muted">${Q.mode==='review'?'Review':'Quiz'} · ${Q.idx+1} of ${Q.queue.length}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="panel q">${prompt}${body}</div>${fb}`;
}
function answer(ok){
  const Q=V.quiz, q=Q.queue[Q.idx], P=getP();
  Q.answered.ok = ok;
  const first = !Q.missed.has(q.id) && !q.retry;
  if (Q.mode==='review' && !q.retry) {
    const c = P.cards[q.id] || {b:0,d:0};
    if (ok) { c.b=Math.min(6,c.b+1); c.d=today()+INT[c.b]; } else { c.b=0; c.d=today()+1; }
    P.cards[q.id]=c;
  }
  if (ok) { Q.xp += first ? (Q.mode==='review'?5:10) : 2; }
  else {
    Q.missed.add(q.id);
    if (!Q.requeued.has(q.id)) { Q.requeued.add(q.id); const nq=makeQ(q.id, q.t==='build'?'en2pt':q.t, P); nq.retry=true; Q.queue.push(nq); }
  }
  speak(PH[q.id].pt);
  render();
  afterRender=null;
  const b=document.getElementById('contBtn'); if (b) b.focus({preventScroll:true});
}
function finishQuiz(){
  const Q=V.quiz, P=getP();
  const total=Q.ids.length, firstRight=total-Q.missed.size, pct=firstRight/total;
  let stars=0;
  if (Q.mode==='lesson') {
    stars = pct>=0.9?3:pct>=0.7?2:1;
    P.lessons[Q.unitId]=Math.max(P.lessons[Q.unitId]||0, stars);
    const t=today();
    Q.ids.forEach(id=>{ if (!P.cards[id]) P.cards[id] = Q.missed.has(id) ? {b:0,d:t+1} : {b:1,d:t+1}; });
    Q.xp += 20;
  }
  P.xp += Q.xp; touchDay(P); save();
  V.done = {stars, firstRight, total, xp:Q.xp, mode:Q.mode, unitId:Q.unitId, missed:[...Q.missed]};
  go({screen:'done'});
  if (stars===3 || (Q.mode==='review' && pct===1)) confetti();
}

function chatRules(P){
  const C=V.chat; const s=SCEN[P.track==='adult'?'adult':'junior'].find(x=>x.id===C.scen); const L=LEVELS.find(l=>l.id===C.lvl);
  return `You are a conversation partner for someone learning EUROPEAN Portuguese (the Portuguese of Portugal), so they can talk with their family and friends in Portugal.
Character: ${s.role}
The learner: ${P.track==='adult' ? 'an English-speaking adult whose long-term partner is Portuguese' : 'an English-speaking child aged about 11 whose mum is Portuguese. Keep everything friendly and suitable for a child'}. Level: ${L.desc}.
Rules:
- Use only European Portuguese as spoken in Portugal today: "tu" with family and friends, "estar a + infinitive" (never the gerund), Portugal vocabulary (pequeno-almoço, autocarro, telemóvel, casa de banho, gelado, sumo, golo, giro, fixe). Never use Brazilian forms.
- Stay in character. Each reply is ${L.len}, and usually ends with a simple question to keep the conversation going.
- If the learner writes in English or mixes languages, they are stuck: reply in character in Portuguese, and in "fix" show how to say what they meant in European Portuguese.
- If the learner makes a mistake, still reply naturally, and put the correction in "fix". Ignore missing accents and capital letters.
- Be warm, patient and encouraging.
Reply with only a JSON object with these string fields:
{"pt": "your reply in European Portuguese", "en": "a natural English translation of your reply", "fix": "empty if the learner's last message was fine; otherwise the corrected European Portuguese followed by a very short reason in English", "hint": "one short, simple thing the learner could say next, in European Portuguese"}`;
}
async function chatSend(text){
  const P=getP(), C=V.chat;
  const sample = await getSample();
  if (!sample) { AI='no'; render(); return; }
  const userTurn = text==null ? '(Start the conversation now with a short greeting in character.)' : text;
  if (text!=null) C.msgs.push({who:'me', text});
  C.turns.push({role:'user', content:userTurn});
  C.busy=true; C.err=''; C.draft=''; render(); scrollChat();
  C.ctl = new AbortController();
  try {
    const r = await sample.json([{role:'user', content:chatRules(P)}, ...C.turns.slice(-16)], {cache:false, signal:C.ctl.signal});
    const reply = {pt:String(r?.pt||'').trim(), en:String(r?.en||'').trim(), fix:String(r?.fix||'').trim(), hint:String(r?.hint||'').trim()};
    if (!reply.pt) throw {code:'upstream_error'};
    if (V.chat!==C) return;
    C.turns.push({role:'assistant', content:JSON.stringify(reply)});
    if (text!=null && reply.fix) C.msgs[C.msgs.length-1].fix = reply.fix;
    C.msgs.push({who:'them', pt:reply.pt, en:reply.en, hint:reply.hint, showEn:C.lvl==='start'});
    C.busy=false;
    if (text!=null) { P.xp += 3; touchDay(P); save(); }
    render(); scrollChat(); speak(reply.pt);
  } catch(e) {
    if (V.chat!==C) return;
    C.turns.pop();
    if (text!=null) { C.msgs.pop(); C.draft=text; }
    C.busy=false; C.err=aiError(e);
    render();
  }
}
function scrollChat(){ const el=document.querySelector('.composer'); if (el) el.scrollIntoView({block:'end'}); }

function makeVQ(vs){
  const vb=vs[Math.floor(Math.random()*vs.length)], t=shuffle(Object.keys(TENSES))[0], p=Math.floor(Math.random()*5);

  return {v:vb.v, t, p, right, opts:shuffle(opts)};
}

  const qs = D.questions.map((q,qi)=>{ const a=O.ans[qi];
    return `<div class="q" style="gap:8px"><b>${qi+1}. ${esc(q.q)}</b><div class="choices">${q.options.map((o,oi)=>{ let c=''; if (a!=null){ if (oi===q.answer) c='right'; else if (a===oi) c='wrong'; } return `<button class="choice ${c}" data-act="oq" data-q="${qi}" data-i="${oi}" ${a!=null?'disabled':''}>${esc(o)}</button>`; }).join('')}</div></div>`; }).join('');
  const tr = O.showT ? `<div class="chat">${D.lines.map(l=>`<div class="msg ${l.who==='A'?'them':'me'}"><span class="small muted">${esc(D.speakers[l.who]||l.who)}</span><div class="bub">${esc(l.pt)}</div><div class="tools">${playBtn(l.pt,'sm')}<span class="tr">${esc(l.en)}</span></div></div>`).join('')}</div>` : '';
  return setup + `<div class="panel">
    <div><span class="label">${esc(D.topic)}</span><h3>${esc(D.title)}</h3></div>
    <div class="row"><button class="btn primary" data-act="oplay">${SPK} Play the conversation</button><button class="btn" data-act="oplay" data-slow="1">${SLOW} Slowly</button><button class="btn" data-act="ostop">Stop</button></div>
    <p class="small muted">Listen two or three times before answering. No peeking at the transcript.</p>
    ${qs}
    <div class="row"><button class="btn" data-act="otrans">${O.showT?'Hide':'Show'} the transcript</button></div>
    ${tr}
  </div>`;
}
async function ouvirGen(){
  const O=V.ouvir, sample=await getSample();
  if (!sample) { AI='no'; render(); return; }
  O.busy=true; O.err=''; render();
  const topic=OUVIR_TOPICS[O.topic];
  try {
    const r = await sample.json(`Write a short, natural everyday dialogue in EUROPEAN Portuguese (as spoken in Portugal today, never Brazilian: "tu" between family and friends, "estar a + infinitive", Portugal vocabulary) for an English-speaking adult learner whose partner's family is Portuguese.
Situation: ${topic}.
Level: ${O.stage===1 ? 'beginner. Short simple sentences, mostly present tense, very common words' : 'lower intermediate. Everyday sentences that use the past tenses (pretérito perfeito and imperfeito) and "ir + infinitive" for plans'}.
Write 6 to 8 lines between two speakers, A and B, each line one or two sentences. Give the speakers Portuguese first names.
Then write 3 multiple-choice comprehension questions in English about specific details in the dialogue, each with 3 English options and the index (0-2) of the correct one.
Reply with only a JSON object: {"title": "short English title", "speakers": {"A": "name", "B": "name"}, "lines": [{"who": "A", "pt": "Portuguese line", "en": "English translation"}], "questions": [{"q": "question", "options": ["...", "...", "..."], "answer": 0}]}`, {cache:false});
    const lines = Array.isArray(r?.lines) ? r.lines.filter(l=>l && l.pt).map(l=>({who:l.who==='B'?'B':'A', pt:String(l.pt), en:String(l.en||'')})) : [];
    const questions = Array.isArray(r?.questions) ? r.questions.filter(q=>q && q.q && Array.isArray(q.options) && q.options.length>=2)
      .map(q=>({q:String(q.q), options:q.options.map(String), answer:Math.max(0, Math.min(q.options.length-1, Math.round(+q.answer)||0))})) : [];
    if (!lines.length) throw {code:'upstream_error'};
    if (V.ouvir!==O) return;
    const sp = r.speakers && typeof r.speakers==='object' ? r.speakers : {};
    O.data={title:String(r.title||topic), topic, speakers:{A:String(sp.A||'A'), B:String(sp.B||'B')}, lines, questions};
    O.ans={}; O.showT=false; O.busy=false; render();
    speakLines(lines);
  } catch(e) {
    if (V.ouvir!==O) return;
    O.busy=false; O.err = e?.code==='invalid_json' ? 'The dialogue came back garbled. Try making another one.' : aiError(e);
    render();
  }
}

/* ---------- match game (junior) ---------- */
function matchPick(P, units){
  return `<div class="panel"><div><h3>Match game</h3><p class="muted">Match each Portuguese word to its English twin as fast as you can. Beat your best time!</p></div>
    <div class="units">${units.map(u=>`<button class="unit" data-act="match" data-u="${u.id}"><span class="top"><span class="n">${esc(u.en)}</span>${P.best[u.id]?`<span class="small"><b>Best ${fmtTime(P.best[u.id])}</b></span>`:''}</span><h3>${esc(u.title)}</h3></button>`).join('')}</div></div>`;
}
const fmtTime = ms => { const s=Math.round(ms/100)/10; return s.toFixed(1)+'s'; };
let matchTimer=null;
function startMatch(uid){
  const P=getP(), u=unitById(P.track, uid);
  const pick = shuffle(u.ids).slice(0,6);
  const cards = shuffle(pick.flatMap(id=>[{k:id,text:PH[id].pt,lang:'pt'},{k:id,text:PH[id].en,lang:'en'}]));
  V.match={uid, cards, sel:null, bad:[], start:Date.now(), end:null, found:0};
  go({screen:'match'});
  clearInterval(matchTimer);
  matchTimer=setInterval(()=>{ const el=document.getElementById('mtime'); if (!V.match || V.match.end || !el) { clearInterval(matchTimer); return; } el.textContent=fmtTime(Date.now()-V.match.start); },100);
}
function matchView(P){
  const M=V.match, u=unitById(P.track, M.uid);
  if (M.end) {
    const t=M.end-M.start;
    return `<div class="panel center"><span class="label">${esc(u.title)}</span><h1>${M.newBest?'New best time!':'Done!'}</h1>
      <div class="timer">${fmtTime(t)}</div><p>Best: <b>${fmtTime(P.best[M.uid])}</b> · +15 XP</p>
      <div class="row" style="justify-content:center"><button class="btn primary big" data-act="match" data-u="${M.uid}">Play again</button><button class="btn" data-act="home">Back</button></div></div>`;
  }
  return `<div class="row between"><button class="linkBtn" data-act="home">← Stop</button><span class="timer" id="mtime">0.0s</span></div>
    <div><span class="label">Match game</span><h2>${esc(u.title)}</h2></div>
    <div class="mgrid">${M.cards.map((c,i)=>`<button class="mcard ${c.lang}${c.done?' done':''}${M.sel===i?' sel':''}${M.bad.includes(i)?' bad':''}" data-act="mc" data-i="${i}" ${c.done?'disabled':''}>${esc(c.text)}</button>`).join('')}</div>`;
}
function matchClick(i){
  const M=V.match, c=M.cards[i]; if (c.done) return;
  if (c.lang==='pt') speak(c.text);
  if (M.sel===null || M.sel===i) { M.sel = M.sel===i?null:i; M.bad=[]; render(); return; }
  const o=M.cards[M.sel];
  if (o.k===c.k && o.lang!==c.lang) {
    o.done=c.done=true; M.found++; M.sel=null; M.bad=[];
    if (c.lang==='en') speak(o.text);
    if (M.found===M.cards.length/2) {
      M.end=Date.now(); const P=getP(); const t=M.end-M.start;
      M.newBest = !P.best[M.uid] || t<P.best[M.uid]; if (M.newBest) P.best[M.uid]=t;
      P.xp+=15; touchDay(P); save(); render(); confetti(); return;
    }
  } else { M.bad=[M.sel,i]; M.sel=null; }
  render();
}

/* ---------- little learner ---------- */
function pic(it){ if (it[3]) return `<span class="swatch" style="background:${it[3]}"></span>`; return `<span class="emo${/^\d+$/.test(it[2])?' num':''}" aria-hidden="true">${it[2]}</span>`; }
function littleHome(P){
  const total = Object.values(P.little).reduce((a,b)=>a+b,0);
  return `<header class="band">
      <div class="bandTop"><button class="linkBtn" data-act="profiles">← Switch learner</button><div class="chips"><span class="chip">★ ${total} stars</span></div></div>
      <h1>Olá, ${esc(P.name)}!</h1><p>Tap a picture to start. Listen to the words, then play "Find it!" to win stars.</p>
    </header>${voiceNotice()}
    <div class="topics">${LITTLE.map(t=>`<button class="topic" data-act="ltopic" data-t="${t.id}">${pic(t.items[0])}<span class="t">${esc(t.title)}</span><span class="small muted">${esc(t.en)}</span>${starStr(P.little[t.id]||0, Math.min(8,t.items.length))}</button>`).join('')}</div>
    <p class="small muted">For grown-ups: this course needs no reading. Sit with them for the first go, and say the words together. Every tile speaks when tapped.</p>`;
}
function littleTopic(P){
  const T=LITTLE.find(t=>t.id===V.lt);
  return `<div class="row between"><button class="btn" data-act="home">← Back</button><button class="btn sun big" data-act="lgame">Play: Find it!</button></div>
    <div><span class="label">${esc(T.en)}</span><h1>${esc(T.title)}</h1><p class="muted">Tap each picture and say the word out loud.</p></div>
    <div class="lgrid">${T.items.map((it,i)=>`<button class="ltile" data-act="lsay" data-i="${i}" aria-label="${esc(it[0])} (${esc(it[1])})">${pic(it)}<span class="w">${esc(it[0])}</span><span class="small muted">${esc(it[1])}</span></button>`).join('')}</div>`;
}
function newRound(){
  const G=V.game, T=LITTLE.find(t=>t.id===V.lt);
  const target=G.order[G.round];
  const others=shuffle(T.items.map((_,i)=>i).filter(i=>i!==target)).slice(0,2);
  G.opts=shuffle([target,...others]); G.target=target; G.wrong=null; G.solved=false; G.missed=false;
}
function startLittleGame(){
  const T=LITTLE.find(t=>t.id===V.lt);
  const n=Math.min(8,T.items.length);
  V.game={order:shuffle(T.items.map((_,i)=>i)).slice(0,n), round:0, stars:0, n};
  newRound(); go({screen:'game'}); speak(T.items[V.game.target][0]);
}
function littleGame(P){
  const G=V.game, T=LITTLE.find(t=>t.id===V.lt), it=T.items[G.target];
  return `<div class="row between"><button class="btn" data-act="lstop">← Stop</button><span class="stars" style="font-size:24px" aria-label="${G.stars} stars">${'★'.repeat(G.stars)}<span class="off">${'★'.repeat(G.n-G.stars)}</span></span></div>
    <div class="center"><h2>Find it!</h2>${playBtn(it[0],'huge')}<span class="muted">Tap the speaker to hear it again</span></div>
    <div class="game3">${G.opts.map(i=>{ const o=T.items[i]; return `<button class="ltile${G.solved&&i===G.target?' right pop':''}${G.wrong===i?' wrong':''}" data-act="lpick" data-i="${i}" aria-label="${esc(o[1])}">${pic(o)}${G.solved&&i===G.target?`<span class="w">${esc(o[0])}</span>`:''}</button>`; }).join('')}</div>`;
}
function littlePick(i){
  const G=V.game, T=LITTLE.find(t=>t.id===V.lt);
  if (G.solved) return;
  if (i===G.target) {
    G.solved=true; if (!G.missed) G.stars++;
    render(); speak(shuffle(['Muito bem!','Boa!','Excelente!','Fantástico!'])[0] + ' ' + T.items[i][0]);
    setTimeout(()=>{
      if (V.screen!=='game' || V.game!==G) return;
      G.round++;
      if (G.round>=G.n) {
        const P=getP(); P.little[V.lt]=Math.max(P.little[V.lt]||0,G.stars); P.xp+=G.stars*5; touchDay(P); save();
        go({screen:'gdone'}); confetti(); speak(G.stars>=G.n-1?'Parabéns! És um campeão!':'Muito bem!');
      } else { newRound(); render(); speak(T.items[G.target][0]); }
    }, 1500);
  } else {
    G.wrong=i; G.missed=true; render(); speak('Tenta outra vez. ' + T.items[G.target][0]);
  }
}
function littleDone(P){
  const G=V.game, T=LITTLE.find(t=>t.id===V.lt);
  return `<div class="panel center"><h1>${G.stars>=G.n-1?'Parabéns!':'Muito bem!'}</h1>
    <div class="bigStars">${'★'.repeat(G.stars)}<span class="off" style="color:var(--line)">${'★'.repeat(G.n-G.stars)}</span></div>
    <p>You found <b>${G.stars}</b> of ${G.n} first time in <b>${esc(T.title)}</b>.</p>
    <div class="row" style="justify-content:center"><button class="btn sun big" data-act="lgame">Play again</button><button class="btn" data-act="home">More pictures</button></div></div>`;
}

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.createElement('div'); box.className='confetti';
  const cols=['var(--cobalt)','var(--sun)','var(--good)','var(--bad)'];
  for (let i=0;i<46;i++){ const s=document.createElement('i'); s.style.left=Math.random()*100+'%'; s.style.background=cols[i%4]; s.style.animationDelay=(Math.random()*0.5)+'s'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 3000);
}

/* ================= EVENTS ================= */
app.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act=el.dataset.act, P = V.pid ? getP() : null;
  switch(act){
    case 'say': speak(el.dataset.t, !!el.dataset.slow); break;
    case 'pick':
      if (V.screen==='picker') { go({screen:'home', pid:el.dataset.id, tab:'lessons', chat:null, ask:null, verbs:null, ouvir:null}); break; }
      { const Q=V.quiz, q=Q.queue[Q.idx], p=PH[q.id]; if (Q.answered) break;
        const i=+el.dataset.i; Q.answered={pick:i}; answer(q.opts[i]===(q.t==='pt2en'?p.en:p.pt)); }
      break;
    case 'profiles': window.speechSynthesis?.cancel?.(); go({screen:'picker', pid:null, editing:false}); break;
    case 'editNames': go({editing:true}); break;
    case 'cancelEdit': go({editing:false}); break;
    case 'tab': V.tab=el.dataset.tab; render(); break;
    case 'home': clearInterval(matchTimer); go({screen:'home'}); break;
    case 'learn': V.learn={u:el.dataset.u, i:0}; go({screen:'learn'}); speak(PH[unitById(P.track,el.dataset.u).ids[0]].pt); break;
    case 'lnext': V.learn.i++; go({}); speak(PH[unitById(P.track,V.learn.u).ids[V.learn.i]].pt); break;
    case 'lprev': V.learn.i=Math.max(0,V.learn.i-1); go({}); speak(PH[unitById(P.track,V.learn.u).ids[V.learn.i]].pt); break;
    case 'quiz': startQuiz(P, unitById(P.track, el.dataset.u).ids, 'lesson', el.dataset.u); break;
    case 'review': startQuiz(P, shuffle(dueIds(P)).slice(0,20), 'review', null); break;
    case 'quitQuiz': if (V.quiz.mode==='review') save(); go({screen:'home'}); break;
    case 'tile': { const q=V.quiz.queue[V.quiz.idx]; q.built.push(+el.dataset.bi); render(); break; }
    case 'untile': { const q=V.quiz.queue[V.quiz.idx]; q.built.splice(+el.dataset.k,1); render(); break; }
    case 'check': { const Q=V.quiz, q=Q.queue[Q.idx]; Q.answered={pick:-1}; answer(q.built.map(b=>q.bank[b]).join(' ')===PH[q.id].pt); break; }
    case 'cont': { const Q=V.quiz; Q.answered=null; Q.idx++; if (Q.idx>=Q.queue.length) finishQuiz(); else { render(); autoSpeakQ(); } break; }
    case 'scen': V.chat.pick=el.dataset.s; render(); break;
    case 'lvl': V.chat.lvl=el.dataset.l; render(); break;
    case 'startChat': V.chat.scen=V.chat.pick; V.chat.msgs=[]; V.chat.turns=[]; chatSend(null); break;
    case 'endChat': V.chat.ctl?.abort(); V.chat={scen:null, pick:V.chat.scen, lvl:V.chat.lvl, msgs:[], turns:[], busy:false, err:'', draft:''}; render(); break;
    case 'toggleEn': { const m=V.chat.msgs[+el.dataset.i]; m.showEn=!m.showEn; render(); break; }
    case 'useHint': { V.chat.draft=V.chat.msgs[+el.dataset.i].hint; render(); const t=document.getElementById('chatInput'); if (t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length);} break; }
    case 'addCustom': { const A=V.ask; if (!A.res) break; P.custom.push({pt:A.res.pt, en:A.res.en, say:A.res.say, note:A.res.note}); registerCustoms(); P.cards[`c.${P.id}.${P.custom.length-1}`]={b:0,d:today()+1}; A.added=true; save(); render(); break; }
    case 'vdrill': startDrill(el.dataset.m); break;
    case 'vpick': { const D=V.verbs.drill, q=D.qs[D.i]; if (D.ans!=null) break; D.ans=+el.dataset.i; if (q.opts[D.ans]===q.right) D.right++; speak(SAYP[q.p]+' '+q.right); render(); document.getElementById('contBtn')?.focus({preventScroll:true}); break; }
    case 'vnext': { const D=V.verbs.drill; D.i++; D.ans=null; if (D.i>=D.qs.length) { P.xp+=D.right*2; touchDay(P); save(); } render(); break; }
    case 'vstop': V.verbs.drill=null; render(); break;
    case 'otopic': V.ouvir.topic=+el.dataset.i; render(); break;
    case 'ostage': V.ouvir.stage=+el.dataset.s; render(); break;
    case 'ogen': ouvirGen(); break;
    case 'oplay': speakLines(V.ouvir.data.lines, !!el.dataset.slow); break;
    case 'ostop': window.speechSynthesis?.cancel?.(); break;
    case 'otrans': V.ouvir.showT=!V.ouvir.showT; render(); break;
    case 'oq': { const O=V.ouvir, qi=+el.dataset.q, oi=+el.dataset.i; if (O.ans[qi]!=null) break; O.ans[qi]=oi; if (O.data.questions[qi].answer===oi) { P.xp+=5; touchDay(P); save(); } render(); break; }
    case 'match': startMatch(el.dataset.u); break;
    case 'mc': matchClick(+el.dataset.i); break;
    case 'ltopic': V.lt=el.dataset.t; go({screen:'ltopic'}); break;
    case 'lsay': { const it=LITTLE.find(t=>t.id===V.lt).items[+el.dataset.i]; speak(it[0]); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); break; }
    case 'lgame': startLittleGame(); break;
    case 'lstop': go({screen:'ltopic'}); break;
    case 'lpick': littlePick(+el.dataset.i); break;
  }
});
app.addEventListener('submit', e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  if (f==='names') {
    S.profiles.forEach(p=>{ const n=document.getElementById('name-'+p.id).value.trim(); if (n) p.name=n; p.track=document.getElementById('track-'+p.id).value; });
    save(); go({editing:false});
  }
  if (f==='chat') { const t=document.getElementById('chatInput').value.trim(); if (t && !V.chat.busy) chatSend(t); }
  if (f==='ask') { const q=document.getElementById('askInput').value.trim(); if (q && !V.ask.busy) askSend(q); }
});
app.addEventListener('toggle', e=>{ if (e.target.id==='voiceBox') V.voiceOpen=e.target.open; }, true);
app.addEventListener('change', e=>{
  if (e.target.id==='verbSel') { V.verbs.v=e.target.value; render(); }
  if (e.target.id==='voiceSel') { VPREF.name=e.target.value; saveVoicePref(); pickVoice(); V.voiceOpen=true; render(); speak('Olá! Tudo bem?'); }
  if (e.target.id==='rateSel') { VPREF.rate=RATE; saveVoicePref(); speak('Olá! Tudo bem?'); }
});
app.addEventListener('input', e=>{
  if (e.target.id==='rateSel') { RATE=+e.target.value; const l=document.getElementById('rateVal'); if (l) l.textContent=Math.round(RATE*100)+'%'; }
  if (e.target.id==='chatInput' && V.chat) V.chat.draft=e.target.value;
  if (e.target.id==='askInput' && V.ask) V.ask.q=e.target.value;
});
app.addEventListener('keydown', e=>{
  if (e.target.id==='chatInput' && e.key==='Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
});

if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
render();
getSample().then(()=>{ if (V.screen==='home' && V.tab==='chat') render(); });
initDb();
</script>
